<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c1117" />
  <title>Sonata CAN</title>
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="brand">SONATA <span>LF</span></div>
      <div id="conn" class="conn offline" title="Connection">—</div>
    </header>

    <section class="speed-block" aria-label="Vehicle speed">
      <div class="speed-value"><span id="speed">--</span><span class="unit">km/h</span></div>
      <div class="speed-sub">
        <span>Gear <strong id="gear">—</strong> <span id="gear-src" class="src"></span></span>
        <span>RPM <strong id="rpm">—</strong></span>
        <span>Throttle <strong id="throttle">—</strong></span>
      </div>
    </section>

    <section class="signals" aria-label="Indicators">
      <div class="ind" id="turn-l" aria-label="Left turn">◀</div>
      <div class="ind-mid">
        <div class="brake-wrap">
          <div id="brake" class="brake off">BRAKE</div>
          <span id="brake-src" class="src"></span>
        </div>
      </div>
      <div class="ind" id="turn-r" aria-label="Right turn">▶</div>
    </section>

    <section class="steer" aria-label="Steering">
      <div class="steer-label">
        <span>Steering</span>
        <span><strong id="steer-angle">—</strong>°</span>
      </div>
      <div class="steer-wheel-stage">
        <div class="steer-wheel-tick tick-l" aria-hidden="true">L+</div>
        <div class="steer-wheel-wrap">
          <svg
            id="steer-wheel"
            class="steer-wheel"
            viewBox="0 0 200 200"
            role="img"
            aria-label="Steering wheel"
          >
            <!-- Outer rim -->
            <circle class="sw-rim-outer" cx="100" cy="100" r="92" />
            <circle class="sw-rim" cx="100" cy="100" r="84" />
            <circle class="sw-rim-inner" cx="100" cy="100" r="72" />
            <!-- Spokes: top (marked), left, right, bottom stub -->
            <g class="sw-spokes">
              <path d="M100 28 V72" />
              <path d="M28 100 H72" />
              <path d="M128 100 H172" />
              <path d="M100 128 V155" />
            </g>
            <!-- Hub -->
            <circle class="sw-hub" cx="100" cy="100" r="22" />
            <circle class="sw-hub-core" cx="100" cy="100" r="10" />
            <!-- Top dead-center marker (rotates with wheel) -->
            <path class="sw-marker" d="M100 14 L106 28 H94 Z" />
          </svg>
          <div class="steer-wheel-center-dot" aria-hidden="true"></div>
        </div>
        <div class="steer-wheel-tick tick-r" aria-hidden="true">R−</div>
      </div>
      <div class="steer-rate">Rate <strong id="steer-rate">—</strong> °/s</div>
    </section>

    <section class="wheels" aria-label="Wheel speeds">
      <div class="wheel"><span class="wlab">FL</span><span id="wfl" class="wval">—</span></div>
      <div class="wheel"><span class="wlab">FR</span><span id="wfr" class="wval">—</span></div>
      <div class="wheel"><span class="wlab">RL</span><span id="wrl" class="wval">—</span></div>
      <div class="wheel"><span class="wlab">RR</span><span id="wrr" class="wval">—</span></div>
    </section>

    <section class="msg-ages" aria-label="Message presence">
      <div class="msg-ages-label">CAN IDs (age)</div>
      <div id="msg-ages" class="msg-ages-grid"></div>
    </section>

    <footer class="health" aria-label="Connection health">
      <div><span class="hlab">IF</span> <span id="iface">—</span></div>
      <div><span class="hlab">FPS</span> <span id="fps">—</span></div>
      <div><span class="hlab">AGE</span> <span id="age">—</span></div>
      <div><span class="hlab">CHK</span> <span id="chk">0</span></div>
    </footer>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
